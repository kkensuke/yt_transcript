[project]
name = "yt-dlp-transcript"
version = "0.1.0"
description = "YouTube transcript extractor with AI summarization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.118.0",
    "uvicorn>=0.37.0",
    "yt-dlp>=2025.9.26",
]

[project.optional-dependencies]
mac = ["py2app>=0.28.0", "setuptools>=80.0.0"]

[project.scripts]
yt-transcript = "launcher:main"
