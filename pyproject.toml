[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-transcript"
version = "0.3.0"
description = "CLI and web app for extracting YouTube transcripts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
yt-transcript = "yt_transcript.cli:main"
yt-transcript-web = "yt_transcript.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yt_transcript.ui" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
